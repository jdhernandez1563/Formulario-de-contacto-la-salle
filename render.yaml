services:
  - type: web
    name: formulario-contacto-la-salle
    runtime: node
    plan: free
    buildCommand: npm ci && npm --prefix frontend ci && npm run build
    preDeployCommand: npm run migrate
    startCommand: npm run start:production
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: ENABLE_DEBUG
        value: "false"
      - key: DATABASE_SCHEMA
        value: production
      - key: DATABASE_SSL
        value: "false"
      - key: DATABASE_URL
        fromDatabase:
          name: formulario-contacto-la-salle-db
          property: connectionString

databases:
  - name: formulario-contacto-la-salle-db
    databaseName: formulario_lasalle
    user: formulario_lasalle
    plan: free
